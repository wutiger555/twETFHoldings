version: '3.8'

services:
  # Flask 後端
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///etf_app.db
      - FINMIND_TOKEN=${FINMIND_TOKEN}
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  # Redis 快取
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # PostgreSQL 資料庫（可選）
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: etf_app
  #     POSTGRES_USER: etf_user
  #     POSTGRES_PASSWORD: etf_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  redis_data:
