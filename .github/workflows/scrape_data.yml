
name: Daily ETF Data Scraper

on:
  # 允許您從 GitHub Actions 頁面手動觸發此工作流程
  workflow_dispatch:
  # 設定排程：在每天的 UTC 20:00 (台灣時間凌晨 4:00) 執行
  schedule:
    - cron: '0 20 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v3

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 3. Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 4. Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Run scraper
        run: python scripts/scraper.py

      - name: 6. Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated: Update ETF data"
          file_pattern: data/*.json
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
